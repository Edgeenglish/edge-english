<title>엣지영어 레벨테스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Inter:wght@500;700&display=swap">
<style>
/* Layout: one centered column (max 640px) — 시작 → 문제 1장씩 → 결과(레벨·추천·복습·메일·상담) */
:root{
  --bg:#F3F6F8; --card:#FFFFFF; --fg:#140F33; --muted:#6B6880; --line:#E2E0EE;
  --accent:#7D5FFF; --accent-ink:#FFFFFF; --accent-soft:#EEEAFF;
  --ok:#1F8A5B; --ok-soft:#E3F5EC; --bad:#D2414B; --bad-soft:#FCE9EA;
  --kakao:#FEE500; --kakao-ink:#191919;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --num:"Inter","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0D1F; --card:#1A1730; --fg:#F1EFFA; --muted:#A7A3BF; --line:#2E2A48;
  --accent:#9A83FF; --accent-ink:#140F33; --accent-soft:#2A2350;
  --ok:#4CC58E; --ok-soft:#163327; --bad:#FF6B74; --bad-soft:#3A1B20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0D1F; --card:#1A1730; --fg:#F1EFFA; --muted:#A7A3BF; --line:#2E2A48;
  --accent:#9A83FF; --accent-ink:#140F33; --accent-soft:#2A2350;
  --ok:#4CC58E; --ok-soft:#163327; --bad:#FF6B74; --bad-soft:#3A1B20; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.demo{max-width:640px;margin:12px auto 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.demo b{color:var(--fg);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--fg);padding:6px 12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 12px}
.frame{max-width:640px;margin:12px auto 0}
.frame.phone{max-width:390px;border:8px solid var(--fg);border-radius:28px;padding:16px 14px;background:var(--bg);min-height:640px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.stack{display:flex;flex-direction:column;gap:14px}
h1{font-size:28px;line-height:1.3;margin:0;font-weight:900;text-wrap:balance}
h2{font-size:19px;margin:0;font-weight:700;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;text-align:center;text-decoration:none}
.btn[disabled]{opacity:.4;cursor:default}
.btn.kakao{background:var(--kakao);color:var(--kakao-ink)}
.btn.done{background:var(--line);color:var(--muted)}
.facts{display:flex;gap:10px;flex-wrap:wrap}
.facts span{background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:500}
/* 문제 */
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:700;color:var(--fg)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.sit{display:inline-block;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.q{font-size:21px;font-weight:700;line-height:1.5;margin:0}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);text-align:center;color:var(--accent)}
.opts{display:grid;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:13px 16px;text-align:left;font-size:17px;font-family:var(--num),var(--font)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
/* 결과 */
.level{display:flex;gap:16px;align-items:center}
.score{flex:none;width:88px;height:88px;border-radius:50%;border:6px solid var(--accent);display:grid;place-items:center;text-align:center;font-family:var(--num)}
.score b{font-size:26px;line-height:1;display:block}
.score small{font-size:12px;color:var(--muted)}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px;text-align:center}
.ladder div{padding:6px 0;border-radius:6px;background:var(--line);color:var(--muted)}
.ladder div.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.rec{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.rec h3{margin:0;font-size:16px}
.books{display:flex;flex-wrap:wrap;gap:8px}
.books span{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:14px;font-family:var(--num),var(--font);font-weight:500}
a.link{color:var(--accent);font-weight:700;text-decoration:none;font-size:15px}
.camp{background:var(--accent-soft);border-radius:12px;padding:14px 16px}
/* 복습 */
.rv{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.rv .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tag{font-size:13px;font-weight:700;color:var(--accent)}
.ans{font-size:15px;display:flex;flex-direction:column;gap:2px}
.x{color:var(--bad)} .o{color:var(--ok)}
.exp{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:15px}
.exp p{margin:0 0 6px} .exp p:last-child{margin:0}
.en{font-family:var(--num),var(--font)}
.drill{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.drill .s{font-size:16px;font-weight:500}
.dopts{display:flex;flex-wrap:wrap;gap:8px}
.dopt{border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 14px;font-family:var(--num),var(--font);font-size:15px}
.dopt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.dopt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.dopt[disabled]{cursor:default}
.fb{font-size:14px}
details summary{cursor:pointer;font-weight:700;font-size:15px}
.rtitle{text-align:center;font-size:32px}
.gift{background:var(--accent-soft);border-radius:14px;padding:16px 18px}
.gift-h{font-size:18px;font-weight:700;margin-bottom:10px}
.gift-h b{color:var(--accent)}
.gift ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.gift li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.45}
.gift li i{flex:none;font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:900;margin-top:1px}
.gift li span{min-width:0}
.gift li b{display:block;font-size:16px}
.free{color:var(--accent);font-size:1.25em;background:linear-gradient(transparent 62%,var(--accent-soft) 62%)}
.say{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.say h4{margin:0;font-size:15px}
.line{display:flex;gap:10px;align-items:center}
.line .en{min-width:0;font-size:15px}
.play{flex:none;border:1.5px solid var(--accent);background:var(--card);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.play[disabled]{opacity:.4;cursor:default}
/* 메일 */
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:500}
input[type=text],input[type=email]{font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.chk input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.terms{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:10px 12px;margin:6px 0 0}
.err{color:var(--bad);font-size:13px;margin:0}
.allok{text-align:center;padding:8px 0}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media (max-width:420px){h1{font-size:24px}.q{font-size:19px}.card{padding:18px}.score{width:76px;height:76px}}
.promo{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.promo-h{text-align:center;font-size:24px;font-weight:900}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pimg{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;max-width:100%}
.pbody{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.pbody h3{margin:0;font-size:19px;line-height:1.35;text-wrap:balance}
.pbody p{margin:0;font-size:15px}
.ptag{align-self:flex-start;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 10px}
.note{margin:18px 20px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px 14px;font-family:var(--num),var(--font);font-size:14px;line-height:1.5;box-shadow:0 6px 18px -10px rgba(20,15,51,.35)}
.note-top{display:flex;gap:5px;align-items:center;margin-bottom:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.note-t{margin-left:6px;font-weight:700;font-size:13px}
.note-d{font-size:12px;color:var(--muted);margin-bottom:6px}
.note-s{font-weight:700;color:var(--accent);margin-top:6px;font-size:13px}
.note-l{padding-left:10px;border-left:2px solid var(--line)}
.note-l s{color:var(--bad)}
.note-l.good{color:var(--ok);font-weight:700}
.steps{list-style:none;margin:0;padding:0 20px 20px;display:grid;gap:8px}
.steps li{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px}
.steps li i{flex:none;font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--num);font-size:13px;font-weight:700}
.steps li b{margin-right:6px;font-size:15px}
.steps li:nth-child(3),.steps li:nth-child(4){outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.spk-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sq{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sq-top{display:flex;gap:10px;align-items:center}
.said{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px;min-height:1em}
.said:empty{display:none}
.btn.mic{font-size:15px;padding:12px}
.row .btn.ghost{font-size:15px;padding:12px}
.typed{font:inherit;font-size:15px;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);width:100%}
.res{display:flex;flex-direction:column;gap:10px;font-size:15px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.rgrid div{background:var(--accent-soft);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.better{border-left:3px solid var(--accent);padding-left:10px;display:flex;flex-direction:column;gap:4px}
.rvprog{display:flex;gap:10px;align-items:center;font-size:14px}
.rvprog .bar{flex:1}
.cheer{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:500;animation:wiggle .6s ease-in-out .05s 1}
@keyframes wiggle{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-2px) rotate(-.4deg)}40%{transform:translateX(2px) rotate(.4deg)}60%{transform:translateX(-1px) rotate(-.2deg)}80%{transform:translateX(1px)}}
@media (prefers-reduced-motion:reduce){.cheer{animation:none}}
.cheer.done{display:flex;flex-direction:column;gap:4px;text-align:center;padding:20px}
.cheer.done b{font-size:20px;color:var(--accent)}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:18px 20px 0}
.tgrid figure{margin:0;display:flex;flex-direction:column;gap:4px;align-items:center}
.tgrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.tgrid figcaption{font-family:var(--num);font-weight:700;font-size:14px}
.btn.naver{background:#03C75A;color:#fff}
</style>

<div class="demo" aria-label="시안 보기 설정">

<script>
const KAKAO = 'https://pf.kakao.com/_blxgib';
const BOOKS = 'https://edgeenglish.kr/books';

// 문제 20개 (14번 Would you mind 삭제, 3번에 -s 추가): 1~5 입문 · 6~10 초급 · 11~15 중급 · 16~20 고급
const Q = [
 {sit:'가족 소개', q:'My sister ___ a nurse. She works at a hospital.', o:['am','is','are','be'], a:1, tag:'be동사 (am / is / are)',
  e:['주어에 따라 be동사가 달라져요.','I → am · He / She / It / 한 사람 → is · You / We / They / 여러 명 → are'],
  d:[{s:'We ___ so hungry. Let\'s grab a bite.',o:['are','is','am'],a:0},{s:'My boss ___ super chill today.',o:['is','are','am'],a:0},{s:'I ___ on my way! Five minutes.',o:['am','is','are'],a:0}]},
 {sit:'아침 루틴', q:'I ___ coffee every morning. Can\'t live without it!', o:['drink','drinks','drinking','am drink'], a:0, tag:'현재형 — 매일 하는 일',
  e:['매일·자주 하는 일은 현재형 동사 그대로 써요.','I / You / We / They 뒤에는 -s를 붙이지 않아요. am을 같이 쓰지도 않아요.'],
  d:[{s:'I usually ___ the bus to work.',o:['take','takes','taking'],a:0},{s:'We ___ out every Friday night.',o:['go','goes','going'],a:0},{s:'They ___ Netflix on weekends. Total couch potatoes.',o:['watch','watches','watching'],a:0}]},
 {sit:'가족 소개', q:'My brother ___ at a bank. He loves his job.', o:['work','works','working','is work'], a:1, tag:'주어에 따라 -s 붙이기',
  e:['He / She / It / 한 사람이 주어면 현재형 동사에 -s를 붙여요.','I / You / We / They 뒤에는 -s 없이 원래 모양 그대로예요.'],
  d:[{s:'My mom ___ me every single morning. Like clockwork.',o:['calls','call','calling'],a:0},{s:'My roommates ___ super late. So annoying.',o:['get up','gets up','getting up'],a:0},{s:'This app ___ really well. Totally worth it.',o:['works','work','working'],a:0}]},
 {sit:'식당', q:'___ you like spicy food?', o:['Do','Are','Does','Is'], a:0, tag:'일반동사 의문문 (Do)',
  e:['like·have·want 같은 일반동사로 물을 때는 맨 앞에 Do를 붙여요.','Are you…?는 뒤에 hungry·tired 같은 상태가 올 때 써요.'],
  d:[{s:'___ you wanna grab lunch?',o:['Do','Are','Is'],a:0},{s:'___ they live near here?',o:['Do','Does','Are'],a:0},{s:'___ you have a charger? My phone\'s dying.',o:['Do','Are','Does'],a:0}]},
 {sit:'수업 중', q:'Sorry, ___ you speak a little slower?', o:['could','are','do','did'], a:0, tag:'Could you…? (부탁하기)',
  e:['"~해 줄 수 있어요?"는 Could you + 동사 원래 모양이에요.','Can you…?보다 조금 더 부드러워요.'],
  d:[{s:'___ you say that again?',o:['Could','Are','Did'],a:0},{s:'Could you ___ me a second?',o:['give','giving','gave'],a:0},{s:'___ you pass me the salt?',o:['Could','Are','Do'],a:0}]},
 {sit:'첫 만남', q:'"___ do you live?" "In Seoul, near Hongdae."', o:['Where','What','When','Who'], a:0, tag:'의문사 (Where / What / When / Who)',
  e:['Where 어디 · What 무엇 · When 언제 · Who 누구','Where do you live? / What do you do? / When do you get off work?'],
  d:[{s:'"___ is your birthday?" "Next Friday!"',o:['When','Where','Who'],a:0},{s:'"___ is that guy?" "Oh, he\'s my cousin."',o:['Who','What','Where'],a:0},{s:'"___ do you want for dinner?" "Pizza, obviously."',o:['What','Who','When'],a:0}]},
 {sit:'주말 이야기', q:'I ___ to Busan last weekend. It was so fun!', o:['go','went','gone','going'], a:1, tag:'과거형',
  e:['last weekend·yesterday처럼 끝난 일은 과거형으로 말해요.','go → went, have → had처럼 모양이 바뀌는 동사도 있어요.'],
  d:[{s:'I ___ a super weird dream last night.',o:['had','have','has'],a:0},{s:'We ___ that new burger place yesterday. So good.',o:['tried','try','tries'],a:0},{s:'She ___ me at midnight. Like, why?',o:['called','calls','call'],a:0}]},
 {sit:'문자', q:'"What ___ you doing right now?" "Just chilling at home."', o:['do','are','did','were'], a:1, tag:'현재진행형 (be + -ing)',
  e:['"지금 ~하는 중"은 be동사 + 동사-ing로 말해요.','doing이 있으면 앞에 do가 아니라 are / is / am이 와요.'],
  d:[{s:'Shh, the baby ___ sleeping.',o:['is','are','does'],a:0},{s:'I\'m ___ dinner. Call you back?',o:['making','make','made'],a:0},{s:'What ___ you guys watching?',o:['are','do','is'],a:0}]},
 {sit:'친구랑 외출', q:'I\'m ___ grab some food. You want anything?', o:['going to','go','will','going'], a:0, tag:'be going to (~할 거야)',
  e:['"~할 거야"는 be going to + 동사 원래 모양이에요. (I\'m going grab ✗)','말할 때는 gonna로 줄여 말하기도 해요.'],
  d:[{s:'It\'s ___ rain. Bring an umbrella.',o:['going to','going','go'],a:0},{s:'I\'m ___ crash early tonight. So tired.',o:['going to','will','going'],a:0},{s:'Are you ___ come to the party?',o:['going to','going','will'],a:0}]},
 {sit:'옷 쇼핑', q:'This jacket is ___ than that one. Way comfier.', o:['warm','warmer','warmest','more warm'], a:1, tag:'비교급 (-er than)',
  e:['둘을 비교할 때는 형용사 + -er + than이에요.','짧은 단어는 more 대신 -er를 붙여요. good은 better로 바뀌어요.'],
  d:[{s:'This sofa is way ___ than my old one. So comfy!',o:['softer','soft','softest'],a:0},{s:'The subway is ___ than a taxi at rush hour.',o:['faster','fast','more fast'],a:0},{s:'Honestly, this place is ___ than the one we went to last time.',o:['better','gooder','more good'],a:0}]},
 {sit:'운동', q:'"How ___ do you work out?" "Like, three times a week."', o:['often','much','many','long'], a:0, tag:'How often (얼마나 자주)',

    </div>
    <div class="row">
      <button class="btn ghost" id="prev" ${k===0?'disabled':''}>이전</button>
      <button class="btn" id="next" ${pick===null?'disabled':''}>${k===Q.length-1?'결과 보기':'다음'}</button>

}

let WRONG=[];
function cheer(p,n,seen,rem){
  if(p===0) return `틀린 문제 ${n}개, 하나씩 같이 봐요. 지금 배워 두면 다시는 안 틀려요!`;
  if(rem===1) return '마지막 문제예요! 이것만 보면 끝나요.';
  if(rem<=2) return `이제 딱 ${rem}개만 더 보면 돼요! 거의 다 왔어요.`;
  const L=['복습 안 하면 다음에 같은 문제를 또 틀릴 수 있어요. 조금만 더 힘내요!',
           '귀찮아도 지금 한 번 보면 오래 기억에 남아요.',
           `벌써 ${seen}개 끝냈어요. 이 기세로 가 봐요!`,
           '소리 내어 따라 읽으면 입에 더 잘 붙어요.'];
  return L[(p-1)%L.length];
}
const PROMO_CHEER=['잠깐! 이런 선생님들과 수업해요','잠깐! 수업에서는 이런 노트를 매번 적어 드려요','잠깐! 선생님은 이렇게 골라요'];
let SEQ=[], SHOWN=new Set();
function buildSeq(){
  SEQ=[]; const at={1:0,3:1,5:2};
  WRONG.forEach((w,idx)=>{SEQ.push({t:'q',w}); if(idx in at) SEQ.push({t:'p',i:at[idx]});});
}
function showTail(){
  const t=document.getElementById('tail'); if(!t) return; t.hidden=false;
  [0,1,2].forEach(i=>{const c=document.getElementById('promo'+i); if(c) c.hidden=SHOWN.has(i);});
  const pr=document.getElementById('promo'); if(pr) pr.hidden=SHOWN.size>=3;
}
function renderRv(){
  const box=document.getElementById('rvbox'); if(!box) return;
  const n=WRONG.length; SAY=[];
  if(!n){box.innerHTML='<p class="allok">다 맞혔어요!</p>';showTail();return;}
  if(st.rp===0) buildSeq();
  const p=st.rp, pages=SEQ.length;
  if(p>=pages){
    showTail();
    box.innerHTML=`<div class="cheer done"><b>복습 끝!</b><span>오늘 본 ${n}개는 이제 내 거예요. 다음엔 안 틀릴 거예요. 응원해요!</span></div>
      <button class="btn ghost" id="rvagain">처음부터 다시 보기</button>`;
    document.getElementById('rvagain').onclick=()=>{st.rp=0;renderRv();box.closest('.card').scrollIntoView({behavior:'smooth',block:'start'});};
    return;
  }
  const item=SEQ[p];
  const qBefore=SEQ.slice(0,p).filter(x=>x.t==='q').length;
  const shown=item.t==='q'?qBefore+1:qBefore, rem=n-qBefore;
  let body;
  if(item.t==='q'){
    body=`<div class="cheer">${cheer(qBefore,n,qBefore,rem)}</div>${renderReview(item.w)}`;
  } else {
    SHOWN.add(item.i);
    const c=document.getElementById('promo'+item.i);
    body=`<div class="cheer">${PROMO_CHEER[item.i]}</div>${c?c.outerHTML.replace(/ id="promo\d"/,'').replace(/ hidden=""/,''):''}`;
  }
  box.innerHTML=`<div class="rvprog"><span class="num">${shown} / ${n}</span><div class="bar"><i style="width:${shown/n*100}%"></i></div></div>
    ${body}
    <div class="row">
      <button class="btn ghost" id="rvprev" ${p===0?'disabled':''}>이전</button>
      <button class="btn" id="rvnext">${p===pages-1?'복습 끝내기':'다음 ›'}</button>
    </div>`;
  const go=d=>{st.rp+=d;renderRv();box.closest('.card').scrollIntoView({behavior:'smooth',block:'start'});};
  document.getElementById('rvprev').onclick=()=>{if(p>0)go(-1);};
  document.getElementById('rvnext').onclick=()=>go(1);
  bindDrills();
}
function renderReview({q,k}){
  const full = (i)=>esc(fill(q.q,q.o[i]));
  return `<div class="rv">
    <div class="head"><span class="tag">${q.tag}</span><span class="muted small num">${k+1}번</span></div>
    <div class="ans en">
      <span class="x">✗ ${full(st.picks[k])}</span>
      <span class="o">✓ ${full(q.a)}</span>
    </div>
    <div class="exp">${q.e.map(t=>`<p>${esc(t)}</p>`).join('')}</div>
    <details ${''}><summary>연습 문제 ${q.d.length}개 풀고 기억에 콕 박아 두세요</summary>
      ${q.d.map((d,j)=>`<div class="drill" data-q="${k}" data-d="${j}">
        <span class="s en">${blank(d.s)}</span>
        <div class="dopts">${d.o.map((o,m)=>`<button class="dopt" data-m="${m}">${esc(o)}</button>`).join('')}</div>
        <span class="fb" aria-live="polite"></span>
      </div>`).join('')}
    </details>
    <div class="say"><h4>소리 내어 읽어 보세요</h4>
      ${[fill(q.q,q.o[q.a])].map(t=>{SAY.push(t.replace(/"/g,''));return `<div class="line"><button class="play" data-i="${SAY.length-1}" ${TTS?'':'disabled'}>▶ 듣기</button><span class="en">${esc(t)}</span></div>`;}).join('')}
    </div>
  </div>`;
}
const TTS = 'speechSynthesis' in window;
let SAY = [], VOICE = null;
function pickVoice(){
  if(!TTS) return;
  const vs = speechSynthesis.getVoices().filter(v=>/^en[-_](US|GB|AU|CA)/i.test(v.lang));
  const pref = [/natural/i,/neural/i,/Google US English/i,/Samantha/i,/Ava/i,/Allison/i,/Aria/i,/Jenny/i,/Karen/i,/Daniel/i];
  for(const p of pref){const v=vs.find(v=>p.test(v.name)); if(v){VOICE=v;return;}}
  VOICE = vs[0]||null;
}
if(TTS){pickVoice(); speechSynthesis.onvoiceschanged = pickVoice;}

let PLAYING=null;
function speak(t){
  const key=t.replace(/"/g,'');
  if(PLAYING){PLAYING.pause();PLAYING=null;}
  if(TTS) speechSynthesis.cancel();
  if(AUDIO[key]){PLAYING=new Audio('data:audio/mpeg;base64,'+AUDIO[key]);PLAYING.play().catch(()=>{});return;}
  if(!TTS) return;
  const u = new SpeechSynthesisUtterance(t);
  u.lang = VOICE?VOICE.lang:'en-US'; if(VOICE) u.voice = VOICE;
  u.rate = 1.0; u.pitch = 1.0;
  speechSynthesis.speak(u);
}
function bindDrills(){
  document.querySelectorAll('.play[data-i]').forEach(b=>b.onclick=()=>speak(SAY[+b.dataset.i]));
  document.querySelectorAll('.drill').forEach(el=>{
    const d = Q[+el.dataset.q].d[+el.dataset.d];
    el.querySelectorAll('.dopt').forEach(b=>b.onclick=()=>{
      const m=+b.dataset.m;
      el.querySelectorAll('.dopt').forEach(x=>{x.disabled=true; if(+x.dataset.m===d.a)x.classList.add('right');});
      if(m!==d.a) b.classList.add('wrong');
      el.querySelector('.fb').innerHTML = m===d.a?'<span class="o">맞았어요</span>':'<span class="x">정답은 '+esc(d.o[d.a])+'</span>';
    });
  });
}

// 말하기 테스트 (① 글로 바꾸기 + Claude 채점)
const SPK = [
 {q:"So, what do you usually do on weekends?"},
];
let DICT=null, SAMPLE=null, spk=SPK.map(()=>({text:'',ms:0,t0:0})), cur=-1, partial='';
(async()=>{
  if(!window.claude||!claude.use) return;
  try{DICT=await claude.use('dictation');}catch(e){}
  try{SAMPLE=await claude.use('sample');}catch(e){}
  if(DICT){
    DICT.onPartial(({text})=>{partial=text;showSaid(cur);});
    DICT.onFinal(({text})=>{if(cur<0)return;partial='';spk[cur].text=(spk[cur].text+' '+text).trim();showSaid(cur);});
    DICT.onState(({state,reason})=>{
      if(cur<0) return;
      const s=spk[cur];
      if(state==='listening'&&!s.t0) s.t0=Date.now();
      if(state==='idle'){ if(s.t0){s.ms+=Date.now()-s.t0;s.t0=0;}
        if(reason==='not_granted'||reason==='unavailable'){DICT=null;}
        const i=cur; cur=-1; partial=''; showSaid(i); }
      micUI();
    });
  }
  bindSpeak();
})();
function words(t){return t.trim()?t.trim().split(/\s+/).length:0;}
function answerOf(i){const ta=document.getElementById('typed'+i);return (DICT?spk[i].text:(ta?ta.value:'')).trim();}
function showSaid(i){
  const el=document.getElementById('said'+i); if(!el) return;
  const t=(spk[i].text+(i===cur&&partial?' '+partial:'')).trim();
  el.textContent = i===cur ? '듣고 있어요…' : (t ? `녹음 완료 ✓ ${Math.max(1,Math.round(spk[i].ms/1000))}초` : '');
  el.hidden=!DICT||(!t&&i!==cur);
  const g=document.getElementById('grade'+i); if(g) g.disabled=!answerOf(i)||i===cur;
}
function micUI(){
  SPK.forEach((_,i)=>{const m=document.getElementById('mic'+i); if(!m) return;
    m.hidden=!DICT||!SAMPLE;
    m.textContent = i===cur ? '■ 말하기 끝' : (spk[i].text?'● 다시 말하기':'● 말하기 시작');
    m.disabled = cur>=0 && i!==cur;});
}
function bindSpeak(){
  const box=document.getElementById('spk'); if(!box) return;
  if(window.claude && SAMPLE===null && DICT===null && !box.dataset.waited){box.dataset.waited='1';}
  document.querySelectorAll('[data-spk]').forEach(b=>b.onclick=()=>speak(SPK[+b.dataset.spk].q));
  SPK.forEach((_,i)=>{
    const m=document.getElementById('mic'+i), g=document.getElementById('grade'+i), ta=document.getElementById('typed'+i);
    ta.hidden = true;
    ta.oninput=()=>showSaid(i);
    m.onclick=()=>{
      if(cur===i){DICT.stop().catch(()=>{});return;}
      if(!spk[i].text){} else {spk[i]={text:'',ms:0,t0:0};}
      cur=i; partial=''; micUI(); showSaid(i);
      DICT.start({language:'en'}).catch(e=>{cur=-1;micUI();
        if(e&&(e.code==='not_granted'||e.code==='unavailable')){DICT=null;bindSpeak();}});
    };
    g.onclick=()=>grade(i);
    showSaid(i);
  });
  micUI();
  const note=document.getElementById('spk-note');
  if(!SAMPLE) note.textContent='이 화면에서는 AI 채점을 쓸 수 없어요.';
  else if(!DICT) note.textContent='이 화면에서는 마이크를 쓸 수 없어요. PC 크롬에서 열어 주세요.';
}
async function grade(i){
  const ans=answerOf(i); if(!ans||!SAMPLE) return;
  const res=document.getElementById('res'+i), g=document.getElementById('grade'+i);
  g.disabled=true; res.hidden=false; res.textContent='채점하는 중…';
  const sec=Math.max(1,Math.round(spk[i].ms/1000)), w=words(ans);
  const spoken=!!DICT && spk[i].ms>0;
  const prompt=`You grade a Korean adult's spoken English answer for placement in a 1:1 online English class with a native tutor. The answer came from speech-to-text, so ignore punctuation, capitalization and small transcription slips.

Tutor's question: "${SPK[i].q}"
Student's answer: "${ans}"
${spoken?`Speaking time: ${sec} seconds, ${w} words.`:''}

Judge:
- understood: did the answer actually respond to the question?
- vocab: range and naturalness of words for this question.
- grammar: errors that would confuse a listener matter most.
Each is one of "좋아요", "보통", "연습 필요".
- level: one of "입문","초급","중급","고급".
- feedback: Korean, 2 short friendly sentences ending in ~요. Point out the single most useful fix.
- better: a natural, casual way a native speaker would say the student's answer (1-2 sentences, keep their meaning; contractions and casual words like gonna are fine).

Reply with JSON only: {"understood":"","vocab":"","grammar":"","level":"","feedback":"","better":""}`;
  try{
    const r=await SAMPLE.json(prompt,{modelTier:'default'});
    res.innerHTML='';
    const grid=document.createElement('div'); grid.className='rgrid';
    [['질문 이해',r.understood],['어휘',r.vocab],['문법',r.grammar],['말하기 레벨',r.level]].forEach(([k,v])=>{
      const d=document.createElement('div'); const a=document.createElement('span'); a.className='muted small'; a.textContent=k;
      const b=document.createElement('b'); b.textContent=v||'-'; d.append(a,b); grid.append(d);});
    const fb=document.createElement('p'); fb.textContent=r.feedback||''; fb.style.margin='0';
    const bt=document.createElement('div'); bt.className='better';
    const l=document.createElement('span'); l.className='muted small'; l.textContent='원어민은 이렇게 말해요';
    const s=document.createElement('span'); s.className='en'; s.textContent=r.better||'';
    const p=document.createElement('button'); p.className='play'; p.textContent='▶ 듣기'; p.disabled=!TTS; p.onclick=()=>speak(r.better||'');
    const line=document.createElement('div'); line.className='line'; line.append(p,s);
    bt.append(l,line);
    res.append(grid,bt,fb);
  }catch(e){
    res.textContent = e&&e.code==='not_granted' ? 'AI 채점을 허용하지 않아서 채점하지 못했어요.' : '채점하지 못했어요. 잠시 뒤 다시 눌러 주세요.';
  }
  g.disabled=!answerOf(i);
}
