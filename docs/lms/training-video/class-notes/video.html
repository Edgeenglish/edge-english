<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-feature-settings:"calt" 0,"liga" 0;width:1280px;height:720px;overflow:hidden;font-family:Inter,sans-serif;background:#17243f}
.scene{position:absolute;inset:0;display:none}
.navy{background:#17243f;color:#fff;padding:0 80px}
.brand{color:#f08a24;font-weight:700;font-size:22px;margin-top:74px}
.big{font-size:50px;font-weight:700;margin-top:52px;letter-spacing:-.5px}
.sub{font-size:22px;color:#c9d1df;margin-top:14px}
ul{list-style:none;margin-top:26px}
li{position:relative;padding-left:36px;font-size:27px;line-height:40px;margin-bottom:14px;color:#f2f4f8}
li:before{content:"";position:absolute;left:4px;top:15px;width:12px;height:12px;border-radius:50%;background:#f08a24}
.u{background-image:linear-gradient(#f04e5a,#f04e5a);background-repeat:no-repeat;background-position:0 100%;background-size:0% 3px;padding-bottom:3px}
#doc{background:#fff}
.bar{height:52px;background:#17243f;color:#fff;display:flex;align-items:center;padding-left:28px;font-size:17px}
.bar b{font-weight:700;margin-right:16px}.bar span{color:#c9d1df}
.left{position:absolute;left:0;top:52px;width:801px;bottom:0;background:#eef0f5}
.tab{height:41px;background:#f6f7f9;color:#555;font-size:15px;padding:12px 24px}
.viewport{position:absolute;left:60px;top:59px;width:680px;bottom:0;overflow:hidden}
.page{background:#fff;border:1px solid #dde0e6;min-height:900px;padding:30px 40px 40px;font-family:Arial,'Liberation Sans',Arimo,sans-serif;color:#222;font-size:21px;transform-origin:50% 0}
.date{font-weight:700;font-size:21px;margin-bottom:14px}
.sec{margin-bottom:22px}
.ln{line-height:40px;min-height:0;white-space:pre-wrap}
.r{color:#d32222;font-weight:700}.bo{font-weight:700}.it{font-style:italic;color:#666}.q{font-weight:700;font-size:25px;color:#17243f}
.right{position:absolute;left:830px;top:96px;width:420px;color:#17243f}
.badge{display:inline-block;background:#f08a24;color:#fff;font-weight:700;font-size:19px;border-radius:20px;padding:6px 26px}
.rt{font-size:32px;font-weight:700;margin-top:18px;line-height:42px}
.rd{font-size:20px;color:#444;line-height:31px;margin-top:14px}
.rd .u{background-image:linear-gradient(#d32222,#d32222)}
.caret{display:inline-block;width:2px;height:24px;background:#222;vertical-align:-4px;margin-left:1px}
</style></head><body>
<div class="scene navy" id="s_title"><div class="brand">Edge English</div><div class="big">How to Write Class Notes</div><div class="sub">Edge English Tutor Training</div></div>
<div class="scene navy" id="s_why"><div class="brand">Edge English</div><div class="big">Why it matters</div><ul id="why"></ul></div>
<div class="scene" id="doc"><div class="bar"><b>Edge English</b><span>Tutor Training &nbsp;·&nbsp; How to Write Class Notes</span></div>
 <div class="left"><div class="tab">Sienna_Peter &nbsp;–&nbsp; Google Docs</div><div class="viewport"><div class="page" id="page"></div></div></div>
 <div class="right"><span class="badge" id="badge"></span><div class="rt" id="rt"></div><div class="rd" id="rd"></div></div></div>
<div class="scene navy" id="s_rules"><div class="brand">Edge English</div><div class="big">Two important rules</div><ul id="rules"></ul></div>
<script>
const T=window.TL;
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
const fmt=s=>s.replace(/\*(.+?)\*/g,'<span class="u">$1</span>');
function bullets(id,items){const ul=document.getElementById(id);ul.innerHTML=items.map(b=>`<li>${fmt(b.text)}</li>`).join('')}
bullets('why',T.why);bullets('rules',T.rules);
// build doc
const page=document.getElementById('page');
page.innerHTML='<div class="date" id="date"></div>'+T.secs.map((s,i)=>`<div class="sec" id="sec${i}">`+s.lines.map((l,j)=>`<div class="ln" id="l${i}_${j}"></div>`).join('')+'</div>').join('');
function lineHTML(segs,n){let out='',left=n;for(const [cls,txt] of segs){if(left<=0)break;const p=txt.slice(0,left);left-=p.length;out+=cls?`<span class="${cls}">${p.replace(/</g,'&lt;')}</span>`:p.replace(/</g,'&lt;')}return out}
const len=segs=>segs.reduce((a,s)=>a+s[1].length,0);
function ul(el,t0,t){el.querySelectorAll('.u').forEach((u,k)=>{u.style.backgroundSize=(ease((t-t0-k*1.5)/1.0)*100)+'% 3px'})}
let scroll=0,lastSec=-1;
window.render=function(t){
 const show=id=>document.querySelectorAll('.scene').forEach(s=>s.style.display=s.id===id?'block':'none');
 if(t<T.why_start){show('s_title');return}
 if(t<T.doc_start){show('s_why');const lis=document.querySelectorAll('#why li');T.why.forEach((b,k)=>{const o=ease((t-b.at)/0.4);lis[k].style.opacity=o;lis[k].style.transform=`translateY(${(1-o)*10}px)`;ul(lis[k],b.at+0.5,t)});return}
 if(t>=T.rules_start){show('s_rules');const lis=document.querySelectorAll('#rules li');T.rules.forEach((b,k)=>{const o=ease((t-b.at)/0.4);lis[k].style.opacity=o;lis[k].style.transform=`translateY(${(1-o)*10}px)`;ul(lis[k],b.at+0.5,t)});return}
 show('doc');
 let cur=0;T.secs.forEach((s,i)=>{if(t>=s.start)cur=i});
 const s=T.secs[cur];
 if(cur!==lastSec){document.getElementById('badge').textContent=s.n;document.getElementById('rt').textContent=s.title;document.getElementById('rd').innerHTML=fmt(s.desc);lastSec=cur}
 const ro=ease((t-s.start)/0.4);const rp=document.querySelector('.right');rp.style.opacity=ro;rp.style.transform=`translateX(${(1-ro)*14}px)`;
 ul(document.getElementById('rd'),s.start+0.8,t);
 // typing
 let caretEl=null;
 const dateSegs=[['',T.date]];const dn=Math.floor(Math.max(0,t-T.date_at)*T.cps);
 const de=document.getElementById('date');de.innerHTML=lineHTML(dateSegs,dn);if(dn>0&&dn<len(dateSegs)+8)caretEl=de;
 T.secs.forEach((sc,i)=>sc.lines.forEach((l,j)=>{const el=document.getElementById(`l${i}_${j}`);const n=Math.floor(Math.max(0,t-l.at)*T.cps);const L=len(l.segs);el.innerHTML=lineHTML(l.segs,n);el.style.display=t>=l.at?'block':'none';if(t>=l.at)caretEl=el;}));
 document.querySelectorAll('.caret').forEach(c=>c.remove());
 if(caretEl&&t<T.zoom_at){const c=document.createElement('span');c.className='caret';c.style.opacity=(Math.floor(t*2.2)%2)?1:0.15;caretEl.appendChild(c)}
 // scroll / zoom
 const vp=document.querySelector('.viewport').clientHeight;
 let target=0;if(caretEl){const b=caretEl.offsetTop+caretEl.offsetHeight+60;target=Math.max(0,b-vp)}
 scroll+= (target-scroll)*0.12;
 const contentH=page.querySelector('#sec'+(T.secs.length-1)).offsetTop+page.querySelector('#sec'+(T.secs.length-1)).offsetHeight+30;
 const z=ease((t-T.zoom_at)/1.2);const sc=1-z*(1-Math.min(1,(vp-20)/contentH));
 page.style.transform=`translateY(${-scroll*(1-z)}px) scale(${sc})`;
};
</script></body></html>
