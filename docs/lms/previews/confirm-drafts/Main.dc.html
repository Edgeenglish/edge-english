<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>등록 마지막 단계</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5b3fd9}a:hover{color:#3f27a8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f6f5fa; font-family: 'Pretendard', system-ui, -apple-system, sans-serif; color: #1d1b2b; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #ffffff; border-bottom: 1px solid #e6e3ef">
    <span style="font-size: 16px; font-weight: 700">신규 학생 등록</span>
    <span style="font-size: 14px; color: #6b6880">4/4</span>
  </div>
  <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
    <h1 style="margin: 0; font-size: 20px; font-weight: 700">최종 확인</h1>
    <div style="background: #ffffff; border: 1px solid #e6e3ef; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 14.5px">
      <div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: #6b6880">학생</span><span style="font-weight: 600">가상학생일 (STU-9001)</span></div>
      <div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: #6b6880">수업</span><span>50분 · 주2회 · 1개월(4주)</span></div>
      <div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: #6b6880">결제</span><span>확인함 · 계좌이체</span></div>
      <div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: #6b6880">강사</span><span style="font-weight: 600">가상강사 Alex (Sydney)</span></div>
      <div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: #6b6880">정규 시간</span><span style="text-align: right">화·목 19:00 한국<br><span style="color: #6b6880; font-size: 13px">강사 현지 21:00</span></span></div>
      <div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: #6b6880">첫 수업</span><span>11/3(화) 19:00</span></div>
      <div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: #6b6880">충돌</span><span style="color: #1f7a4d; font-weight: 600">없음 (8회 모두 확인)</span></div>
    </div>
    <p style="margin: 0; font-size: 15px; font-weight: 700">강사에게 이 일정을 물어봤나요?</p>
    <button type="button" style="min-height: 56px; border-radius: 12px; border: 0; background: #7d5fff; color: #ffffff; font-size: 15.5px; font-weight: 700; text-align: left; padding: 10px 16px; display: flex; flex-direction: column; gap: 2px; cursor: pointer">
      <span>아직 → 저장하고 강사 제안 문구 복사</span>
      <span style="font-size: 12.5px; font-weight: 400; opacity: 0.9">WhatsApp에 붙여 보내면 '강사 답 대기'로 남아요</span>
    </button>
    <button type="button" style="min-height: 56px; border-radius: 12px; border: 1.5px solid #7d5fff; background: #ffffff; color: #4b33c4; font-size: 15.5px; font-weight: 700; text-align: left; padding: 10px 16px; display: flex; flex-direction: column; gap: 2px; cursor: pointer">
      <span>강사가 가능하다고 했어요 → 저장 + 확정</span>
      <span style="font-size: 12.5px; font-weight: 400; color: #6b6880">정규 수업 8회 생성, 바로 양쪽 안내 화면으로</span>
    </button>
    <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #6b6880">강사 '가능' 답을 받기 전에는 수업이 만들어지지 않아요. 확정은 이 버튼이나 '처리할 일'의 [강사 가능 → 확정] 한 번뿐이에요.</p>
  </div>
  <div style="padding: 12px 16px 20px; background: #ffffff; border-top: 1px solid #e6e3ef">
    <button type="button" style="width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid #e6e3ef; background: #ffffff; font-size: 15px; color: #1d1b2b">← 이전</button>
  </div>
</div>
</x-dc>

</body>
</html>
